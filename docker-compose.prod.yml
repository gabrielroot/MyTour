services:
  app:
    image: ${APP_IMAGE}
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      TIMEZONE: ${TIMEZONE:-America/Fortaleza}
      LOCK_DSN: ${LOCK_DSN:-flock}
      APP_IMAGE: ${APP_IMAGE:-registry.gitlab.grwxtech.com/gabrielroot/mytour.grwxtech.com/app:latest}
      NGINX_IMAGE: ${NGINX_IMAGE:-registry.gitlab.grwxtech.com/gabrielroot/mytour.grwxtech.com/nginx:latest}
    restart: unless-stopped
    volumes:
      # - ./.env:/var/www/.env:ro
      - symfony_app_var:/var/www/var
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - symfony_app
      - dokploy-network

  nginx:
    image: ${NGINX_IMAGE}
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - symfony_app
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Accept: text/html", "http://localhost/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - app

volumes:
  symfony_app_var:

networks:
  symfony_app:
  dokploy-network:
    external: true
