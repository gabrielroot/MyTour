services:
  mytour_app:
    image: ${APP_IMAGE}
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      TIMEZONE: ${TIMEZONE:-America/Fortaleza}
      LOCK_DSN: ${LOCK_DSN:-flock}
      REDIS_URL: redis://redis_mytour:6379
      APP_IMAGE: ${APP_IMAGE:-registry.gitlab.grwxtech.com/gabrielroot/mytour.grwxtech.com/app:latest}
      NGINX_IMAGE: ${NGINX_IMAGE:-registry.gitlab.grwxtech.com/gabrielroot/mytour.grwxtech.com/nginx:latest}
    restart: unless-stopped
    volumes:
      - symfony_app_var:/var/www/var
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - symfony_app
      - dokploy-network
    deploy:
      replicas: 5
      placement:
        constraints:
          - node.labels.arch == aarm
      update_config:
        parallelism: 2
        delay: 10s
        failure_action: rollback
        max_failure_ratio: 0.25
        order: start-first
      rollback_config:
        parallelism: 3
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  mytour_nginx:
    image: ${NGINX_IMAGE}
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - symfony_app
      - dokploy-network
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Accept: text/html", "http://localhost/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - mytour_app
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.arch == aarm
      update_config:
        parallelism: 2
        delay: 10s
        failure_action: rollback
        max_failure_ratio: 0.25
        order: start-first
      rollback_config:
        parallelism: 3
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
  redis_mytour:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
        - '6379'
    command: >
        redis-server
        --save 20 1
        --maxmemory 256m
        --maxmemory-policy allkeys-lru
        --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network 
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == heart
      update_config:
        parallelism: 2
        delay: 10s
        failure_action: rollback
        max_failure_ratio: 0.25
        order: start-first
      rollback_config:
        parallelism: 3
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
  mytour__nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    command:
      - --nginx.scrape-uri=http://mytour_nginx:80/stub_status
    expose:
      - '9113'
    networks:
      - symfony_app
      - monitoring
    depends_on:
      - mytour_nginx
    deploy:
      replicas: 1
      update_config:
        parallelism: 2
        delay: 10s
        failure_action: rollback
        max_failure_ratio: 0.25
        order: start-first
      rollback_config:
        parallelism: 3
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
volumes:
  symfony_app_var:
  redis_data:
networks:
  symfony_app:
  dokploy-network:
    external: true
  monitoring:
    external: true